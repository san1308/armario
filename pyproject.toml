[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armario"
version = "0.1.0"
description = "Probador virtual: combina fotos de prendas para ver cómo quedan juntas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.47",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "Pillow>=11.0",
    "pillow-heif>=0.18",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "rembg[cpu]>=2.0.60",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
